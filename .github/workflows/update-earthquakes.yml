name: Actualizar datos de terremotos

on:
  schedule:
    # Cada 5 minutos — mínimo permitido por GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar y parsear el feed IGN
        run: python3 scripts/fetch_earthquakes.py

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes.json
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos."
          else
            git commit -m "🌍 Terremotos $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
