<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Terremotos – España (IGN)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --bg:      #0f1117;
      --surface: #1a1d2e;
      --border:  #2a2d3e;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --accent:  #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── CABECERA ── */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 7px 14px; display: flex; align-items: center; gap: 10px;
      flex-shrink: 0; flex-wrap: wrap;
    }
    header h1 { font-size: .95rem; font-weight: 700; white-space: nowrap; }
    header h1 span { color: var(--accent); }
    /* En desktop header-row1 es invisible (inline con el resto) */
    .header-row1 { display: contents; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; align-items: center; }
    .pill {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 9px;
      font-size: .73rem; color: var(--muted); white-space: nowrap;
    }
    .pill b { color: var(--text); }

    /* ── FILTRO MAGNITUD ── */
    .filter-group {
      display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    }
    .filter-group label {
      font-size: .68rem; color: var(--muted); padding: 3px 7px;
      background: var(--bg); border-right: 1px solid var(--border);
      display: flex; align-items: center; white-space: nowrap;
    }
    .filter-btn {
      background: transparent; border: none; border-right: 1px solid var(--border);
      color: var(--muted); padding: 4px 9px; font-size: .73rem;
      cursor: pointer; transition: background .12s, color .12s; white-space: nowrap;
    }
    .filter-btn:last-child { border-right: none; }
    .filter-btn:hover { background: rgba(255,255,255,.05); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

    .btn {
      background: var(--accent); border: none; border-radius: 6px;
      color: #fff; padding: 5px 11px; font-size: .78rem;
      cursor: pointer; white-space: nowrap; transition: opacity .15s;
    }
    .btn:hover { opacity: .8; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }

    /* ── LAYOUT ── */
    .content { display: flex; flex: 1; min-height: 0; }
    #map { flex: 1; min-width: 0; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 290px; flex-shrink: 0; background: var(--surface);
      border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-hd {
      padding: 7px 12px; font-size: .72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .eq-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .eq-item {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 9px 12px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .12s;
    }
    .eq-item:hover  { background: rgba(255,255,255,.04); }
    .eq-item.active { background: rgba(99,102,241,.12); border-left: 3px solid var(--accent); }
    .mag-badge {
      min-width: 38px; height: 38px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .eq-info { flex: 1; min-width: 0; }
    .eq-loc  { font-size: .81rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eq-date { font-size: .73rem; color: var(--muted); margin-top: 2px; }
    .eq-coord{ font-size: .68rem; color: var(--border); margin-top: 1px; font-family: monospace; }
    .eq-ign-link {
      display: inline-block; margin-top: 3px;
      font-size: .68rem; color: var(--accent); text-decoration: none; opacity: .8;
    }
    .eq-ign-link:hover { opacity: 1; text-decoration: underline; }

    .legend { border-top: 1px solid var(--border); padding: 9px 12px; flex-shrink: 0; }
    .legend-hd { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
    .lrow { display: flex; align-items: center; gap: 7px; font-size: .73rem; color: var(--muted); line-height: 1.8; }
    .ldot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

    /* ── STATUS / LOADER ── */
    #status {
      display: none; background: #7c2d12; color: #fed7aa;
      font-size: .78rem; padding: 6px 14px; text-align: center; flex-shrink: 0;
    }
    #loader {
      position: absolute; inset: 0; background: rgba(15,17,23,.75);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; z-index: 9999;
    }
    .spin {
      width: 34px; height: 34px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: var(--muted); font-size: .85rem; }

    /* ── PULSO ÚLTIMO TERREMOTO ── */
    .pulse-wrap { position: relative; width: 0; height: 0; pointer-events: none; }
    .pulse-ring {
      position: absolute; border-radius: 50%;
      border: 2px solid var(--ring-color, #ef4444);
      width: 20px; height: 20px; top: -10px; left: -10px;
      opacity: 0; animation: pulse-grow 2s ease-out infinite;
    }
    .pulse-ring:nth-child(2) { animation-delay: .6s; }
    .pulse-ring:nth-child(3) { animation-delay: 1.2s; }
    @keyframes pulse-grow {
      0%   { transform: scale(1); opacity: .8; }
      100% { transform: scale(5); opacity: 0;  }
    }

    /* ── POPUP ── */
    .leaflet-popup-content-wrapper {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    .leaflet-popup-tip { background: var(--surface); }
    .pm { font-size: 1.3rem; font-weight: 800; margin-bottom: 3px; }
    .pl { font-size: .88rem; font-weight: 600; margin-bottom: 3px; }
    .pd { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
    .pa a { color: var(--accent); font-size: .77rem; text-decoration: none; }
    .pa a:hover { text-decoration: underline; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header {
        padding: 5px 10px; gap: 4px;
        flex-direction: column; align-items: flex-start;
      }
      /* Fila 1: título + filtros en la misma línea */
      .header-row1 { display: flex; align-items: center; gap: 8px; width: 100%; flex-wrap: wrap; }
      /* Fila 2: pills de estadísticas en línea */
      .pills {
        flex-wrap: nowrap; overflow-x: auto; width: 100%;
        gap: 5px; padding-bottom: 2px;
        scrollbar-width: none;
      }
      .pills::-webkit-scrollbar { display: none; }
      .pill { font-size: .66rem; padding: 2px 7px; }
      .content { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 40vh; }
      .legend { display: none; }
      .eq-item { padding: 5px 10px; gap: 7px; }
      .mag-badge { min-width: 32px; height: 32px; font-size: .78rem; border-radius: 6px; }
      .eq-loc  { font-size: .76rem; }
      .eq-date { font-size: .68rem; margin-top: 1px; }
      .eq-coord { display: none; }
      .filter-group label { display: none; }
    }
  </style>
</head>
<body>

<header>
  <!-- Fila 1 (desktop: todo en línea; móvil: título + filtros) -->
  <div class="header-row1">
    <h1>🌍 Terremotos <span>España · IGN</span></h1>

    <!-- Filtro tiempo (lado cliente) -->
    <div class="filter-group">
      <label>Período</label>
      <button class="filter-btn active" data-hours="24"  onclick="setHours(24)">24h</button>
      <button class="filter-btn"        data-hours="72"  onclick="setHours(72)">3d</button>
      <button class="filter-btn"        data-hours="168" onclick="setHours(168)">7d</button>
      <button class="filter-btn"        data-hours="0"   onclick="setHours(0)">Todos</button>
    </div>

    <!-- Filtro magnitud (lado cliente) -->
    <div class="filter-group">
      <label>Mín. M</label>
      <button class="filter-btn active" data-mag="0"   onclick="setMag(0)">Todos</button>
      <button class="filter-btn"        data-mag="1.5" onclick="setMag(1.5)">≥1.5</button>
      <button class="filter-btn"        data-mag="2.5" onclick="setMag(2.5)">≥2.5</button>
      <button class="filter-btn"        data-mag="3.5" onclick="setMag(3.5)">≥3.5</button>
    </div>
  </div>

  <!-- Fila 2: pills de estadísticas -->
  <div class="pills">
    <div class="pill">🔢 <b id="s-count">—</b> registros</div>
    <div class="pill">📈 Máx. M<b id="s-max">—</b></div>
    <div class="pill">🕐 <b id="s-updated">—</b></div>
    <div class="pill">⏱ <b id="s-next">—</b></div>
  </div>
</header>

<div id="status"></div>

<div class="content">
  <div id="map">
    <div id="loader"><div class="spin"></div><p>Cargando datos…</p></div>
  </div>
  <div class="sidebar">
    <div class="sidebar-hd">Últimos terremotos</div>
    <div class="eq-list" id="eq-list"></div>
    <div class="legend">
      <div class="legend-hd">Magnitud</div>
      <div class="lrow"><div class="ldot" style="background:#38bdf8"></div>&lt; 1.5 — Micro</div>
      <div class="lrow"><div class="ldot" style="background:#4ade80"></div>1.5 – 2.5 — Menor</div>
      <div class="lrow"><div class="ldot" style="background:#fde047"></div>2.5 – 3.5 — Leve</div>
      <div class="lrow"><div class="ldot" style="background:#fb923c"></div>3.5 – 4.5 — Moderado</div>
      <div class="lrow"><div class="ldot" style="background:#f87171"></div>4.5 – 5.5 — Fuerte</div>
      <div class="lrow"><div class="ldot" style="background:#e879f9"></div>≥ 5.5 — Mayor</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── COOKIES DE PREFERENCIAS ──────────────────────────────────────────────────
function setCookie(name, value, days = 365) {
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/;SameSite=Lax`;
}
function getCookie(name) {
  const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  return m ? decodeURIComponent(m[1]) : null;
}

// ── MAPA ──────────────────────────────────────────────────────────────────────
// Vista por defecto: área metropolitana sur de Granada
const DEFAULT_VIEW = { lat: 37.10, lon: -3.60, zoom: 11 };
const savedPos = getCookie('eq_map_pos');
const initView = savedPos
  ? (([lat, lon, z]) => ({ lat: +lat, lon: +lon, zoom: +z }))(savedPos.split(','))
  : DEFAULT_VIEW;

const map = L.map('map').setView([initView.lat, initView.lon], initView.zoom);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Datos: <a href="https://www.ign.es">IGN</a>',
  maxZoom: 19
}).addTo(map);

const markerLayer = L.layerGroup().addTo(map);

// Guardar posición del mapa cuando el usuario navega
map.on('moveend zoomend', () => {
  const c = map.getCenter();
  setCookie('eq_map_pos', `${c.lat.toFixed(5)},${c.lng.toFixed(5)},${map.getZoom()}`);
});

// ── CONVERSIÓN UTC → HORA ESPAÑA ──────────────────────────────────────────────
// El feed IGN da fechas en formato "DD/MM/YYYY H:MM:SS" en UTC
function toSpanishTime(dateStr) {
  if (!dateStr) return '—';
  const m = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/);
  if (!m) return dateStr;
  const [, dd, mo, yyyy, hh, min, ss] = m;
  const utc = new Date(Date.UTC(+yyyy, +mo - 1, +dd, +hh, +min, +ss));
  return utc.toLocaleString('es-ES', {
    timeZone: 'Europe/Madrid',
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

// ── COLORES Y TAMAÑOS ─────────────────────────────────────────────────────────
function magColor(m) {
  if (m < 1.5) return '#38bdf8';   // azul cielo vivo
  if (m < 2.5) return '#4ade80';   // verde brillante
  if (m < 3.5) return '#fde047';   // amarillo intenso
  if (m < 4.5) return '#fb923c';   // naranja vivo
  if (m < 5.5) return '#f87171';   // rojo claro brillante
  return '#e879f9';                  // violeta neón
}
function magRadius(m) { return Math.max(5, Math.pow(1.85, Math.max(m, 0)) * 1.8); }

// ── CENTRO DE REFERENCIA (Granada) ───────────────────────────────────────────
const GRANADA = { lat: 37.1773, lon: -3.5986 };
const RADIO_KM = 100;

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ── ESTADO ────────────────────────────────────────────────────────────────────
let allEarthquakes = [];   // todos los del JSON
let earthquakes    = [];   // filtrados
let markers        = [];
let currentMinMag  = +(getCookie('eq_mag')  ?? 0);
let currentHours   = +(getCookie('eq_hours') ?? 24);
const POLL_MS      = 60 * 1000;
let nextPoll       = Date.now() + POLL_MS;

// ── ENLACE IGN (construye URL completa aunque el JSON solo traiga el event_id) ─
function ignUrl(eq) {
  const id = eq.event_id || eq.link || '';
  if (!id) return '';
  // Si ya es una URL completa, devolverla tal cual
  if (id.startsWith('http')) return id;
  return `https://www.ign.es/web/ign/portal/ultimos-terremotos/-/ultimos-terremotos/getDetails?evid=${id}`;
}

// ── PARSEO DE FECHA IGN (DD/MM/YYYY H:MM:SS UTC) → ms ────────────────────────
function ignDateToMs(dateStr) {
  if (!dateStr) return null;
  const m = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/);
  if (!m) return null;
  const [, dd, mo, yyyy, hh, min, ss] = m;
  return Date.UTC(+yyyy, +mo - 1, +dd, +hh, +min, +ss);
}

// ── FILTROS ───────────────────────────────────────────────────────────────────
function setHours(h) {
  currentHours = h;
  setCookie('eq_hours', h);
  document.querySelectorAll('[data-hours]').forEach(b =>
    b.classList.toggle('active', +b.dataset.hours === h));
  applyFilter();
  panToLatest();
}

function setMag(m) {
  currentMinMag = m;
  setCookie('eq_mag', m);
  document.querySelectorAll('[data-mag]').forEach(b =>
    b.classList.toggle('active', +b.dataset.mag === m));
  applyFilter();
  panToLatest();
}

// Mueve el mapa para que el terremoto más reciente del filtro sea visible
function panToLatest() {
  if (!earthquakes.length) return;
  const eq = earthquakes[0];
  const latlng = L.latLng(eq.lat, eq.lon);
  if (!map.getBounds().contains(latlng)) {
    map.panTo(latlng, { animate: true });
  }
}

function applyFilter() {
  const cutoff = currentHours > 0 ? Date.now() - currentHours * 3600 * 1000 : 0;
  earthquakes = allEarthquakes.filter(e => {
    if (currentMinMag > 0 && e.magnitude < currentMinMag) return false;
    if (cutoff > 0) {
      const ms = ignDateToMs(e.date);
      if (ms === null || ms < cutoff) return false;
    }
    return true;
  });
  renderAll();
}

// ── CARGA DEL JSON (generado por GitHub Actions) ──────────────────────────────
async function loadData(showLoader) {
  if (showLoader) setLoader(true);
  try {
    const r = await fetch(`./data/earthquakes.json?_=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    allEarthquakes = data.earthquakes || [];
    applyFilter();
    setUpdated(data.updated);
    hideStatus();
  } catch (e) {
    showStatus('⚠️ No se pudieron cargar los datos. El workflow de GitHub Actions genera data/earthquakes.json cada ~1 min.');
  }
  setLoader(false);
}

async function doRefresh() {
  nextPoll = Date.now() + POLL_MS;
  await loadData(true);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll() {
  renderMarkers();
  renderList();
  renderStats();
}

function renderMarkers() {
  markerLayer.clearLayers(); markers = [];
  earthquakes.forEach((eq, i) => {
    const color    = magColor(eq.magnitude);
    const radius   = magRadius(eq.magnitude);
    const isLatest = i === 0;

    const c = L.circleMarker([eq.lat, eq.lon], {
      radius, fillColor: color, color: '#fff', weight: 1.2, opacity: 1, fillOpacity: .9
    });

    c.bindPopup(`
      <div class="pm" style="color:${color}">M ${eq.magnitude.toFixed(1)}</div>
      <div class="pl">${eq.location || 'Localización desconocida'}</div>
      <div class="pd">🕐 Hora España: ${toSpanishTime(eq.date)}</div>
      <div class="pd">📍 ${eq.lat.toFixed(4)}, ${eq.lon.toFixed(4)}</div>
      ${ignUrl(eq) ? `<div class="pa"><a href="${ignUrl(eq)}" target="_blank">Ver en catálogo IGN ↗</a></div>` : ''}
    `, { maxWidth: 280 });

    c.bindTooltip(
      `<b>M ${eq.magnitude.toFixed(1)}</b> · ${eq.location || ''}` +
      `${eq.date ? `<br><span style="font-size:.85em;opacity:.8">🕐 ${toSpanishTime(eq.date)}</span>` : ''}` +
      `${isLatest ? '<br><span style="font-size:.8em;color:#fbbf24">⚡ Último registrado</span>' : ''}` +
      `${ignUrl(eq) ? `<br><a href="${ignUrl(eq)}" target="_blank" style="font-size:.8em;color:#818cf8">Ver en IGN ↗</a>` : ''}`,
      { direction: 'top', offset: [0, -radius], opacity: 1 }
    );

    c.on('click', () => setActive(i, false));
    markerLayer.addLayer(c); markers.push(c);

    // Anillos pulsantes para el más reciente
    if (isLatest) {
      const pulseIcon = L.divIcon({
        className: '',
        html: `<div class="pulse-wrap">
          <div class="pulse-ring" style="--ring-color:${color}"></div>
          <div class="pulse-ring" style="--ring-color:${color}"></div>
          <div class="pulse-ring" style="--ring-color:${color}"></div>
        </div>`,
        iconSize: [0, 0], iconAnchor: [0, 0]
      });
      markerLayer.addLayer(
        L.marker([eq.lat, eq.lon], { icon: pulseIcon, interactive: false, zIndexOffset: 500 })
      );
    }
  });
}

function renderList() {
  const list = document.getElementById('eq-list');
  if (!earthquakes.length) {
    list.innerHTML = '<div style="padding:14px;color:#64748b;font-size:.83rem">Sin terremotos para el filtro seleccionado.</div>';
    return;
  }
  list.innerHTML = earthquakes.map((eq, i) => {
    const color = magColor(eq.magnitude);
    return `
      <div class="eq-item" id="eqi-${i}" onclick="setActive(${i},true)">
        <div class="mag-badge" style="background:${color}">${eq.magnitude.toFixed(1)}</div>
        <div class="eq-info">
          <div class="eq-loc" title="${eq.location}">${eq.location || 'Desconocido'}</div>
          <div class="eq-date">🕐 ${toSpanishTime(eq.date)}</div>
          <div class="eq-coord">${eq.lat.toFixed(4)}, ${eq.lon.toFixed(4)}</div>
          ${ignUrl(eq) ? `<a class="eq-ign-link" href="${ignUrl(eq)}" target="_blank" onclick="event.stopPropagation()">Ver en IGN ↗</a>` : ''}
        </div>
      </div>`;
  }).join('');
}

function renderStats() {
  const n   = earthquakes.length;
  const max = n ? Math.max(...earthquakes.map(e => e.magnitude)) : 0;
  document.getElementById('s-count').textContent = n;
  document.getElementById('s-max').textContent   = max.toFixed(1);
}

// ── ACTIVO ────────────────────────────────────────────────────────────────────
function setActive(i, scroll) {
  document.querySelectorAll('.eq-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`eqi-${i}`);
  if (el) { el.classList.add('active'); if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  const eq = earthquakes[i];
  if (markers[i]) {
    map.setView([eq.lat, eq.lon], Math.max(map.getZoom(), 9), { animate: true });
    markers[i].openPopup();
  }
}

// ── UI ────────────────────────────────────────────────────────────────────────
function setLoader(on)  { document.getElementById('loader').style.display = on ? 'flex' : 'none'; }
function showStatus(m)  { const s = document.getElementById('status'); s.textContent = m; s.style.display = 'block'; }
function hideStatus()   { document.getElementById('status').style.display = 'none'; }
function setUpdated(iso) {
  try {
    document.getElementById('s-updated').textContent =
      new Date(iso).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  } catch (_) {}
}

// ── AUTOPOLL + CUENTA ATRÁS ───────────────────────────────────────────────────
setInterval(() => {
  const rem = Math.max(0, nextPoll - Date.now());
  const m   = Math.floor(rem / 60000);
  const s   = String(Math.floor((rem % 60000) / 1000)).padStart(2, '0');
  document.getElementById('s-next').textContent = `actualiza en ${m}:${s}`;
  if (rem === 0) { nextPoll = Date.now() + POLL_MS; loadData(false); }
}, 1000);

// ── INICIO: aplicar preferencias guardadas en cookies ─────────────────────────
document.querySelectorAll('[data-hours]').forEach(b =>
  b.classList.toggle('active', +b.dataset.hours === currentHours));
document.querySelectorAll('[data-mag]').forEach(b =>
  b.classList.toggle('active', +b.dataset.mag === currentMinMag));
map.invalidateSize();
loadData(true);
</script>
