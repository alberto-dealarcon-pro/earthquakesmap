<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Terremotos – España (IGN)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --bg:      #0f1117;
      --surface: #1a1d2e;
      --border:  #2a2d3e;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --accent:  #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; font-weight: 700; white-space: nowrap; }
    header h1 span { color: var(--accent); }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .pill b { color: var(--text); }
    .btn {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 5px 11px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .8; }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* ── LAYOUT ── */
    .content { display: flex; flex: 1; min-height: 0; }
    #map { flex: 1; min-width: 0; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 290px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-hd {
      padding: 8px 12px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .eq-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    .eq-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .12s;
    }
    .eq-item:hover  { background: rgba(255,255,255,.04); }
    .eq-item.active { background: rgba(99,102,241,.12); border-left: 3px solid var(--accent); }

    .mag-badge {
      min-width: 38px; height: 38px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .eq-info { flex: 1; min-width: 0; }
    .eq-loc  { font-size: .81rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .eq-date { font-size: .73rem; color: var(--muted); margin-top: 2px; }
    .eq-coord{ font-size: .68rem; color: var(--border); margin-top: 1px; font-family: monospace; }

    /* ── LEGEND ── */
    .legend { border-top: 1px solid var(--border); padding: 9px 12px; flex-shrink: 0; }
    .legend-hd { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
    .legend-row { display: flex; align-items: center; gap: 7px; font-size: .73rem; color: var(--muted); line-height: 1.7; }
    .ldot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

    /* ── STATUS / LOADING ── */
    #status {
      display: none;
      background: #7c2d12; color: #fed7aa;
      font-size: .78rem; padding: 5px 14px; text-align: center; flex-shrink: 0;
    }
    #loader {
      position: absolute; inset: 0;
      background: rgba(15,17,23,.75);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; z-index: 9999;
    }
    .spin {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: var(--muted); font-size: .85rem; }

    /* ── POPUP ── */
    .leaflet-popup-content-wrapper {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }
    .leaflet-popup-tip { background: var(--surface); }
    .pm  { font-size: 1.3rem; font-weight: 800; margin-bottom: 3px; }
    .pl  { font-size: .88rem; font-weight: 600; margin-bottom: 3px; }
    .pd  { font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
    .pa a{ color: var(--accent); font-size: .77rem; text-decoration: none; }
    .pa a:hover { text-decoration: underline; }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      .content { flex-direction: column; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 38vh; }
    }
  </style>
</head>
<body>

<header>
  <h1>🌍 Terremotos <span>España</span></h1>
  <div class="pills">
    <div class="pill">🔢 <b id="s-count">—</b> registros</div>
    <div class="pill">📈 Máx. M<b id="s-max">—</b></div>
    <div class="pill">🕐 <b id="s-updated">—</b></div>
    <div class="pill">⏱ <b id="s-next">—</b></div>
  </div>
  <button class="btn secondary" id="btn-layer" onclick="toggleLayer()">🌙 Oscuro</button>
  <button class="btn" onclick="doRefresh()">↺ Actualizar</button>
</header>

<div id="status"></div>

<div class="content">
  <div id="map">
    <div id="loader"><div class="spin"></div><p>Cargando datos…</p></div>
  </div>
  <div class="sidebar">
    <div class="sidebar-hd">Últimos terremotos</div>
    <div class="eq-list" id="eq-list"></div>
    <div class="legend">
      <div class="legend-hd">Magnitud</div>
      <div class="legend-row"><div class="ldot" style="background:#3b82f6"></div>&lt; 1.5 — Micro</div>
      <div class="legend-row"><div class="ldot" style="background:#22c55e"></div>1.5 – 2.5 — Menor</div>
      <div class="legend-row"><div class="ldot" style="background:#eab308"></div>2.5 – 3.5 — Leve</div>
      <div class="legend-row"><div class="ldot" style="background:#f97316"></div>3.5 – 4.5 — Moderado</div>
      <div class="legend-row"><div class="ldot" style="background:#ef4444"></div>4.5 – 5.5 — Fuerte</div>
      <div class="legend-row"><div class="ldot" style="background:#a855f7"></div>≥ 5.5 — Mayor</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ── MAPA ──────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([40.0, -3.5], 6);

const layers = {
  light: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Datos: <a href="https://www.ign.es">IGN</a>',
    maxZoom: 19
  }),
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_matter_all/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a> · Datos: <a href="https://www.ign.es">IGN</a>',
    subdomains: 'abcd', maxZoom: 19
  })
};
let darkLayer = false;
layers.light.addTo(map);

function toggleLayer() {
  if (darkLayer) {
    map.removeLayer(layers.dark);
    layers.light.addTo(map);
    document.getElementById('btn-layer').textContent = '🌙 Oscuro';
  } else {
    map.removeLayer(layers.light);
    layers.dark.addTo(map);
    document.getElementById('btn-layer').textContent = '☀️ Claro';
  }
  darkLayer = !darkLayer;
}

const markersLayer = L.layerGroup().addTo(map);

// ── ESCALA DE COLORES ─────────────────────────────────────────────────────────
function magColor(m) {
  if (m < 1.5) return '#3b82f6';
  if (m < 2.5) return '#22c55e';
  if (m < 3.5) return '#eab308';
  if (m < 4.5) return '#f97316';
  if (m < 5.5) return '#ef4444';
  return '#a855f7';
}
function magRadius(m) { return Math.max(5, Math.pow(1.85, Math.max(m, 0)) * 1.8); }

// ── ESTADO ────────────────────────────────────────────────────────────────────
let earthquakes = [];
let markers     = [];
let activeIdx   = -1;
let lastEtag    = '';           // para detectar cambios en el JSON
const POLL_MS   = 60 * 1000;   // el navegador comprueba el JSON cada 1 minuto
let nextPoll    = Date.now() + POLL_MS;

// ── CARGA DEL JSON ────────────────────────────────────────────────────────────
async function loadJSON(showSpinner) {
  if (showSpinner) setLoader(true);

  try {
    const r = await fetch(`./data/earthquakes.json?_=${Date.now()}`, {
      cache: 'no-store'
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);

    const etag = r.headers.get('ETag') || '';
    const data = await r.json();

    // Solo re-renderizar si los datos cambiaron
    if (etag && etag === lastEtag && !showSpinner) {
      setLoader(false);
      return;
    }
    lastEtag = etag;

    earthquakes = data.earthquakes || [];
    renderAll();
    setUpdated(data.updated);
    hideStatus();
  } catch (e) {
    showStatus('⚠️ No se pudo leer earthquakes.json. ¿Está generado el JSON? → python scripts/fetch_earthquakes.py');
  }

  setLoader(false);
}

async function doRefresh() {
  nextPoll = Date.now() + POLL_MS;
  await loadJSON(true);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll() {
  renderMarkers();
  renderList();
  renderStats();
}

function renderMarkers() {
  markersLayer.clearLayers();
  markers = [];
  earthquakes.forEach((eq, i) => {
    const color  = magColor(eq.magnitude);
    const radius = magRadius(eq.magnitude);
    const c = L.circleMarker([eq.lat, eq.lon], {
      radius, fillColor: color, color: '#fff',
      weight: 0.8, opacity: 0.9, fillOpacity: 0.75
    });
    c.bindPopup(`
      <div class="pm" style="color:${color}">M ${eq.magnitude.toFixed(1)}</div>
      <div class="pl">${eq.location || 'Localización desconocida'}</div>
      <div class="pd">📅 ${eq.date || '—'}</div>
      <div class="pd" style="margin-bottom:6px">📍 ${eq.lat.toFixed(4)}, ${eq.lon.toFixed(4)}</div>
      ${eq.link ? `<div class="pa"><a href="${eq.link}" target="_blank">Ver en catálogo IGN ↗</a></div>` : ''}
    `, { maxWidth: 280 });
    c.bindTooltip(`M ${eq.magnitude.toFixed(1)} · ${eq.location || ''}`, {
      direction: 'top', offset: [0, -radius]
    });
    c.on('click', () => setActive(i, false));
    markersLayer.addLayer(c);
    markers.push(c);
  });
}

function renderList() {
  const list = document.getElementById('eq-list');
  if (!earthquakes.length) {
    list.innerHTML = '<div style="padding:14px;color:#64748b;font-size:.83rem">Sin datos.</div>';
    return;
  }
  list.innerHTML = earthquakes.map((eq, i) => {
    const color = magColor(eq.magnitude);
    return `
      <div class="eq-item" id="eqi-${i}" onclick="setActive(${i},true)">
        <div class="mag-badge" style="background:${color}">${eq.magnitude.toFixed(1)}</div>
        <div class="eq-info">
          <div class="eq-loc" title="${eq.location}">${eq.location || 'Desconocido'}</div>
          <div class="eq-date">${eq.date || '—'}</div>
          <div class="eq-coord">${eq.lat.toFixed(4)}, ${eq.lon.toFixed(4)}</div>
        </div>
      </div>`;
  }).join('');
}

function renderStats() {
  const n   = earthquakes.length;
  const max = n ? Math.max(...earthquakes.map(e => e.magnitude)) : 0;
  document.getElementById('s-count').textContent = n;
  document.getElementById('s-max').textContent   = max.toFixed(1);
}

function setUpdated(iso) {
  try {
    const d = new Date(iso);
    document.getElementById('s-updated').textContent =
      d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  } catch (_) {}
}

// ── ITEM ACTIVO ───────────────────────────────────────────────────────────────
function setActive(i, scroll) {
  document.querySelectorAll('.eq-item').forEach(el => el.classList.remove('active'));
  activeIdx = i;
  const el = document.getElementById(`eqi-${i}`);
  if (el) { el.classList.add('active'); if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  const eq = earthquakes[i];
  if (markers[i]) {
    map.setView([eq.lat, eq.lon], Math.max(map.getZoom(), 9), { animate: true });
    markers[i].openPopup();
  }
}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function setLoader(on) { document.getElementById('loader').style.display = on ? 'flex' : 'none'; }
function showStatus(msg) { const s = document.getElementById('status'); s.textContent = msg; s.style.display = 'block'; }
function hideStatus()    { document.getElementById('status').style.display = 'none'; }

// ── CUENTA ATRÁS ──────────────────────────────────────────────────────────────
setInterval(() => {
  const rem = Math.max(0, nextPoll - Date.now());
  const m   = Math.floor(rem / 60000);
  const s   = String(Math.floor((rem % 60000) / 1000)).padStart(2, '0');
  document.getElementById('s-next').textContent = `comprueba en ${m}:${s}`;

  // Cuando llega a cero, recargar JSON silenciosamente
  if (rem === 0) {
    nextPoll = Date.now() + POLL_MS;
    loadJSON(false);
  }
}, 1000);

// ── INICIO ────────────────────────────────────────────────────────────────────
loadJSON(true);
</script>
</body>
</html>
